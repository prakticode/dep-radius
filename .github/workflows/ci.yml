name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to a pull request cancels its older run; every commit on main keeps its own result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported line, from "engines", and the one the repo pins in .nvmrc
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier, ESLint, TypeScript and tests, through Turborepo
      - run: pnpm check
      - run: pnpm build

  packed:
    name: packed packages install and run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the published packages only; the docs site is built by the check job
      - run: pnpm turbo run build --filter=./packages/*
      # the tarballs npm would receive: a missing file or an unresolved workspace: range fails here,
      # not in a user's terminal
      - name: pack
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in packages/core packages/cli; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          done
      - name: install the tarballs in an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../packs/*.tgz
          npx radius --version
          npx radius --help > /dev/null
      # radius's cache from earlier runs: its entries expire on their own (release note pages after an
      # hour, bodies after a day), and without it every run fetches the notes of every dependency
      # through the workflow token, whose hourly quota a few merges in a row can use up and stall the
      # release job. The run id keys a fresh save each time; restore-keys picks the latest one.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/radius-cache
          key: radius-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: radius-cache-${{ runner.os }}-
      # radius on its own repository: exit 1 (review) and 2 (blocked) are verdicts, 3 is a failure
      - name: run on this repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADIUS_CACHE_DIR: ${{ runner.temp }}/radius-cache
        run: |
          set +e
          "$RUNNER_TEMP/consumer/node_modules/.bin/radius" --markdown >> "$GITHUB_STEP_SUMMARY"
          code=$?
          echo "radius exited with $code"
          test "$code" -le 2
      # --since as the GitHub Action runs it: a commit to compare with, versions from the lockfile
      - name: run --since on this repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADIUS_CACHE_DIR: ${{ runner.temp }}/radius-cache
        run: |
          set +e
          "$RUNNER_TEMP/consumer/node_modules/.bin/radius" --since HEAD --json > "$RUNNER_TEMP/since.json"
          code=$?
          echo "radius exited with $code"
          test "$code" -le 2 || exit 1
          node -e 'const b = require(process.argv[1]); if (b.since?.commit !== process.argv[2]) process.exit(1)' "$RUNNER_TEMP/since.json" "$(git rev-parse HEAD)"
